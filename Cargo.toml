[package]
name = "anonimator"
version = "0.1.0"
edition = "2021"
description = "Vibe coding anonymisé : une IA locale pilote une IA en ligne sans lui montrer votre vrai code."

[lib]
path = "src/lib.rs"

[[bin]]
name = "anonimator"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
dirs = "5"
eframe = "0.31"
getrandom = "0.2"
ignore = "0.4"
jsonwebtoken = "9"
keyring = { version = "3", features = ["windows-native"] }
regex = "1"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
ureq = { version = "2", features = ["json"] }
url = "2"
webbrowser = "1"

[dev-dependencies]
rand = "0.8"
rsa = { version = "0.9", features = ["pem"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
